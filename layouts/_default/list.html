{{ define "main" }}
  {{ $articles := .Pages.GroupByDate "2025" }}
  {{ range $articles }}
  <h2><a href="{{ site.BaseURL }}articles/{{ .Key }}/">{{ .Key }}</a></h2>
  <ul>
    {{ range .Pages }}
    <li>
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a> ({{ .Date.Format "Jan 02, 2006" }})</h3>
      <p>{{ .Summary }}</p>
    </li>
    {{ end }}
  </ul>
  {{ end }}
{{ end }}
