{{ define "main" }}
  <article>
    <header>
      <h1>{{ .Title }}</h1>
      <p><time>{{ .Date.Format "2006-01-02" }}</time></p>
      {{ with .Params.image }}
      <img src="{{ . }}" alt="{{ $.Title }}" width="100%">
      {{ end }}
    </header>
    <section>
      {{ .Content }}
    </section>
  </article>
{{ end }}
