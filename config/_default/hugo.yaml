baseURL: "http://localhost:1313/"
languageCode: "ru"
title: "Go, Artur, Go!"
theme: ""  # Leave empty if using custom layouts
pagination:
  pagerSize: 10

# Enable "summary" auto-generation
summaryLength: 70

# Enable minification for better performance
minify:
  disableXML: true

# Site parameters (used in templates)
params:
  about: "Привет! Меня зовут Артур, я программирую на языках Go, Python. Создаю приложения и делюсь своим опытом в программировании."
  author: "Артур"

permalinks:
  articles: "/articles/:year/:slug/"

# Define output formats
outputs:
  home: ["HTML", "RSS"]
  section: ["HTML", "RSS"]
  taxonomy: ["HTML", "RSS"]
  term: ["HTML", "RSS"]

# Asset processing for CSS and JS (optional)
assetDir: "assets"

# Menu (if needed)
menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "Articles"
      url: "/articles/"
      weight: 2

# Enable Markdown render hooks (for images, links, etc.)
markup:
  goldmark:
    renderer:
      unsafe: true  # Allow raw HTML in Markdown
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
